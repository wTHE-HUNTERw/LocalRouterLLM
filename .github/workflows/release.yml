name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release with Standalone EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executables (LocalRouterLLM.exe & installer.exe)
        run: |
          pyinstaller --noconfirm --clean LocalRouterLLM.spec
          pyinstaller --noconfirm --clean installer.spec

      - name: Create release zip archive
        run: |
          powershell -Command "Compress-Archive -Path dist\LocalRouterLLM.exe, dist\installer.exe, router.py, installer.py, hud.py, config.example.json, install.bat, install.ps1, start.bat, start-debug.bat, start_background.ps1, stop.bat, requirements.txt, README.md, LICENSE -DestinationPath LocalRouterLLM-${{ github.ref_name }}-win-x64.zip -Force"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalRouterLLM ${{ github.ref_name }}
          files: |
            dist/LocalRouterLLM.exe
            dist/installer.exe
            LocalRouterLLM-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
